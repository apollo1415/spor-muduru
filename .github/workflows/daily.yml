name: SPOR MUDURU daily free-data inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax validation
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Collect and analyse
        run: python spor_muduru.py --out reports/today
      - name: Discover bookmaker fixture candidates (manual review required)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds_discovery.py --matches reports/today/matches.csv --out reports/odds
      - name: Audit 14-day source fixture horizon
        run: python horizon_coverage.py --events reports/odds/provider_events.json --out reports/odds --days 14
      - name: Model upcoming 14-day fixtures (research only)
        run: python horizon_models.py --fixtures reports/odds/horizon_fixtures.json --out reports/horizon
      - name: Calculate isolated league-prior research fallbacks
        run: python league_prior_fallback.py --models reports/horizon/matches.csv --out reports/horizon
      - name: Build manual fixture review queue
        run: python fixture_review.py --fixtures reports/odds/horizon_fixtures.json --events reports/odds/provider_events.json --out reports/odds
      - name: Reconcile forward models with provider fixture review queue
        run: python forward_model_review.py --queue reports/odds/fixture_review_queue.csv --models reports/horizon/matches.csv --out reports/odds
      - name: Combine standard and league-prior research coverage
        run: python combined_model_review.py --review reports/odds/forward_model_review.csv --fallback reports/horizon/league_prior_fallback.csv --out reports/odds
      - name: Render readable fixture identity review
        run: python fixture_review_report.py --queue reports/odds/fixture_review_queue.csv --out reports/odds/fixture_review_report.md
      - name: Audit candidate fixtures against organizer evidence snapshot
        run: python official_evidence_audit.py --queue reports/odds/fixture_review_queue.csv --evidence config/official_fixture_evidence.json --out reports/odds/official_evidence_audit.json
      - name: Prepare human fixture verification checklist
        run: python fixture_verification_checklist.py --queue reports/odds/fixture_review_queue.csv --evidence config/official_fixture_evidence.json --out reports/odds
      - name: Audit exact-team fixture coverage and kickoff offsets
        run: python coverage_audit.py --matches reports/today/matches.csv --events reports/odds/provider_events.json --out reports/odds
      - name: Audit bookmaker fixture mismatches
        run: python matching_diagnostics.py --matches reports/today/matches.csv --events reports/odds/provider_events.json --out reports/odds
      - name: Gate bookmaker fixture mappings on explicit manual approvals
        run: python fixture_approval_gate.py --queue reports/odds/fixture_review_queue.csv --evidence config/official_fixture_evidence.json --approvals config/manual_fixture_approvals.csv --out config/approved_fixture_mapping.csv --summary reports/odds/approval_gate_summary.json
      - name: Fetch approved bookmaker odds if configured
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds_provider.py --out reports/odds
      - name: Research-only odds and EV
        run: python odds_ev.py --matches reports/horizon/matches.csv --odds reports/odds/verified_odds.csv --out reports/odds
      - name: Upload research EV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spor-muduru-odds-ev
          path: reports/odds/
          retention-days: 30
          if-no-files-found: warn
      - name: Walk-forward backtest
        run: python backtest.py --out reports/backtest
      - name: Compare team model against league prior on historical matches
        run: python model_comparison.py --out reports/model-comparison
      - name: Gate markets on paired retrospective quality
        run: python market_quality_gate.py --input reports/model-comparison/comparison.csv --out reports/model-comparison
      - name: Out-of-sample calibration audit
        run: python calibration.py --input reports/backtest/predictions.csv --out reports/calibration
      - name: League and time stability audit
        run: python stability.py --input reports/backtest/predictions.csv --out reports/stability
      - name: Flag deteriorating league-market models
        run: python triage.py --input reports/stability/summary.json --out reports/triage
      - name: Upload triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spor-muduru-triage
          path: reports/triage/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload stability audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spor-muduru-stability
          path: reports/stability/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload calibration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spor-muduru-calibration
          path: reports/calibration/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload model comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spor-muduru-model-comparison
          path: reports/model-comparison/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spor-muduru-backtest
          path: reports/backtest/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload future research models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spor-muduru-horizon-models
          path: reports/horizon/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spor-muduru-report
          path: reports/today/
          retention-days: 30
          if-no-files-found: warn
